[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pybalans"
version = "1.4.0"
description = "PyBalans – boekhouding in Python op PostgreSQL · leest en vervangt SQL-Ledger-administraties"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.12"
authors = [{name = "Matthijs Havinga"}]
dependencies = ["psycopg>=3.1", "xmlschema>=3.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9",
       "argon2-cffi>=23.1", "pyotp>=2.9", "segno>=1.6", "psycopg-pool>=3.2", "openpyxl>=3.1",
       "weasyprint>=62", "cryptography>=42", "pillow>=10"]
test = ["pytest", "psycopg[binary]>=3.1", "httpx>=0.27", "aiosmtpd>=1.4", "pypdf>=4"]

[project.scripts]
pybalans = "sqlledger_web.cli:main"
sqlledger-web = "sqlledger_web.cli:main"

[tool.setuptools]
packages = ["sqlledger", "sqlledger.charts", "sqlledger.slschema", "sqlledger_web"]

[tool.setuptools.package-data]
"sqlledger.charts" = ["*.csv"]
"sqlledger.slschema" = ["*.sql", "ref-*.txt", "upgrade/*.sql"]
sqlledger = ["sepa_xsd/*.xsd", "sepa_xsd/*.txt"]
sqlledger_web = ["templates/*.html", "templates/am/*.html", "templates/arap/*.html", "templates/bank/*.html", "templates/batch/*.html", "templates/cp/*.html", "templates/dashboard/*.html", "templates/vat/*.html", "templates/ct/*.html", "templates/gl/*.html", "templates/help/*.html", "templates/ic/*.html", "templates/jc/*.html", "templates/is/*.html", "templates/dunning/*.html", "templates/mail/*.html", "templates/oe/*.html", "templates/rc/*.html", "templates/recurring/*.html", "templates/reports/*.html", "templates/system/*.html", "templates/start/*.html", "static/*", "doctemplates/standard/*.html", "fonts/*.txt", "fonts/*/*.ttf", "fonts/*/*.txt"]
