{% extends "base.html" %}
{% block title %}{{ _("Tweestapsverificatie") }}{% endblock %}
{% block plain %}
<p>{{ _("Voer de code uit uw authenticator-app in.") }}</p>
<form method="post" action="/2fa" class="stack">
  <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
  <label>{{ _("Code") }} <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" autofocus required></label>
  <button>{{ _("Verder") }}</button>
</form>
<form method="post" action="/uitloggen"><input type="hidden" name="csrf" value="{{ ctx.csrf }}"><button class="link small">{{ _("Annuleren") }}</button></form>
{% endblock %}
